; Sample Morph-KGC configuration file generated by CHAD-ASK
; from a LimeSurvey questionnaire response (Section 1: Configuration Setup).
;
; The [CONFIGURATION] section is populated from Q1-Q3 of the questionnaire:
;   Q1 -> output_dir
;   Q2 -> output_format / output_serialization
;   Q3 -> project_iri_base
;
; Q4-Q6 loop and repeat for each additional dataset to be processed:
;   Q4 -> versione
;   Q5 -> mappings (YARRRML mapping file path)
;   Q6 -> file_path (CSV input file path)

[CONFIGURATION]
output_dir            = results
output_format         = N-TRIPLES
output_serialization  = turtle
project_iri_base      = https://w3id.org/changes/4/aldrovandi/
versione              = 1

[DataSource1]
mappings              = mapping_object.yaml
mapping_format        = YARRRML
file_path             = input/objects.csv
delimiter             = ,
quotechar             = "
encoding              = utf-8

[DataSource2]
mappings              = mapping_process.yaml
mapping_format        = YARRRML
file_path             = input/process.csv
delimiter             = ,
quotechar             = "
encoding              = utf-8
